name: macOS checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Run core checks
        run: |
          swift build -c release --product PuntoChecks
          checks="$(swift build -c release --show-bin-path)/PuntoChecks"
          codesign --force --sign - "$checks"
          codesign --verify --strict "$checks"
          "$checks"
      - run: |
          swiftc Sources/PuntoNative/Layouts.swift Sources/PuntoCore/Conversion.swift Scripts/check-layouts.swift -o "$RUNNER_TEMP/punto-layouts-check"
          "$RUNNER_TEMP/punto-layouts-check"
      - run: bash Scripts/build-app.sh
      - run: bash Scripts/audit-bundle.sh
      - name: Audit an update-enabled bundle
        env:
          SPARKLE_FEED_URL: https://example.invalid/appcast.xml
        run: |
          export SPARKLE_PUBLIC_KEY="$(openssl rand -base64 32)"
          bash Scripts/build-app.sh
          bash Scripts/audit-bundle.sh
